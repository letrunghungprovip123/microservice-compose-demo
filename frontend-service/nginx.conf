server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"frontend-service","mode":"public"}';
    }

    location = /info {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"service":"frontend-service","version":"3.0.0","runtime":"React static bundle / Nginx","container_port":80,"persistence":"Stateless","networks":["service-net"],"responsibility":"Serve the public web UI only; API routing belongs to the separate gateway"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
