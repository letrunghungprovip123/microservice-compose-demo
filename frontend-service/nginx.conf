server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS. Using variables makes Nginx re-resolve service names
    # instead of pinning one container IP for the whole Nginx process lifetime.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $customer_upstream http://customer-service:8001;
    set $catalog_upstream http://catalog-service:8002;
    set $order_upstream http://order-service:8003;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"frontend-service"}';
    }

    location = /info {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"service":"frontend-service","version":"2.0.0","runtime":"React + Ant Design / Nginx","container_port":80,"persistence":"Static UI (stateless)","networks":["service-net"],"depends_on":["customer-service:8001","catalog-service:8002","order-service:8003"],"responsibility":"Serve presentation UI and reverse-proxy browser API requests"}';
    }

    location /api/customer/ {
        rewrite ^/api/customer/(.*)$ /$1 break;
        proxy_pass $customer_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Demo-Upstream "customer-service:8001" always;
    }

    location /api/catalog/ {
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $catalog_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Demo-Upstream "catalog-service:8002" always;
    }

    location /api/order/ {
        rewrite ^/api/order/(.*)$ /$1 break;
        proxy_pass $order_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Demo-Upstream "order-service:8003" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
