resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $frontend_upstream http://frontend-service:80;
    set $order_upstream http://order-service:8003;
    set $catalog_upstream http://catalog-service:8002;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # ngrok forwards the original scheme. HTTP clients are redirected so the
    # public contract is HTTPS even though the internal tunnel target is HTTP.
    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok","service":"gateway","public_edge":"ngrok HTTPS"}';
    }

    location = /gateway-info {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"service":"gateway","routing":{"/":"frontend-service:80","/api/order/":"order-service:8003","/api/catalog/":"catalog-service:8002"}}';
    }

    location /api/order/ {
        rewrite ^/api/order/(.*)$ /$1 break;
        proxy_pass $order_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Demo-Route "gateway -> order-service:8003" always;
    }

    location /api/catalog/ {
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $catalog_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Demo-Route "gateway -> catalog-service:8002" always;
    }

    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Demo-Route "gateway -> frontend-service:80" always;
    }
}
